<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 710" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>The research analytics ontology: six classes (work, author, institution, source, authorship and citation), the links between them, and the code lists they use</title>
<desc>Six classes. An authorship links a work, an author and an institution, and an institution has a parent. A citation links a citing work and a cited work, a work can be a version of another, and a work appears in a source. Code lists hang off the classes: work types and record sources for works, source types and tiers for sources, and institution types.</desc>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b6fd8"/></marker>
  <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b7791f"/></marker>
  <style>
    .class { fill: #eaf2ff; stroke: #3b6fd8; stroke-width: 1.5; }
    .list { fill: #fdf6e3; stroke: #b7791f; stroke-width: 1.2; }
    .name { font-size: 15px; font-weight: 700; fill: #111827; }
    .listname { font-size: 13px; font-weight: 700; fill: #111827; }
    .attr { font-size: 12px; font-family: SF Mono, Menlo, Consolas, monospace; fill: #1f2937; }
    .note { font-size: 11.5px; font-style: italic; fill: #5b6475; }
    .link { fill: none; stroke: #3b6fd8; stroke-width: 1.6; marker-end: url(#a); }
    .code { fill: none; stroke: #b7791f; stroke-width: 1.3; marker-end: url(#c); }
    .label { font-size: 12px; font-family: SF Mono, Menlo, Consolas, monospace; paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
    .l-link { fill: #1f3a68; font-weight: 600; }
    .l-code { fill: #8a5a12; }
  </style>
</defs>
<rect width="1080" height="710" fill="#ffffff"/>

<!-- links first, so the boxes sit on top of their ends -->
<path class="link" d="M180,230 L180,152"/>
<path class="link" d="M180,360 L180,438"/>
<path class="link" d="M300,295 L418,295"/>
<path class="link" d="M300,490 C370,490 370,550 302,550"/>
<path class="link" d="M500,120 L500,208"/>
<path class="link" d="M600,120 L600,208"/>
<path class="link" d="M550,380 L550,458"/>
<path class="link" d="M680,330 C750,330 750,370 682,370"/>
<path class="code" d="M680,240 L838,198"/>
<path class="code" d="M680,270 L838,304"/>
<path class="code" d="M680,495 L838,462"/>
<path class="code" d="M680,540 L838,566"/>
<path class="code" d="M180,580 L180,618"/>

<!-- classes -->
<rect class="class" x="60" y="40" width="240" height="110" rx="10"/>
<text class="name" x="74" y="66">Author</text>
<text class="attr" x="74" y="88">name, orcid</text>
<text class="note" x="74" y="116">One person can have several</text>
<text class="note" x="74" y="132">records; one name, several people</text>

<rect class="class" x="60" y="230" width="240" height="130" rx="10"/>
<text class="name" x="74" y="256">Authorship</text>
<text class="attr" x="74" y="278">authorPosition</text>
<text class="attr" x="74" y="296">affiliationSeq</text>
<text class="note" x="74" y="324">Only the affiliation listed</text>
<text class="note" x="74" y="340">last counts</text>

<rect class="class" x="60" y="440" width="240" height="140" rx="10"/>
<text class="name" x="74" y="466">Institution</text>
<text class="attr" x="74" y="488">name, ror, country</text>
<text class="note" x="74" y="516">An affiliated institute (AFF)</text>
<text class="note" x="74" y="532">is not a unit of its parent</text>

<rect class="class" x="420" y="40" width="260" height="80" rx="10"/>
<text class="name" x="434" y="66">Citation</text>
<text class="note" x="434" y="92">One work citing another</text>

<rect class="class" x="420" y="210" width="260" height="170" rx="10"/>
<text class="name" x="434" y="236">Work</text>
<text class="attr" x="434" y="258">title, year, doi</text>
<text class="attr" x="434" y="276">retracted</text>
<text class="note" x="434" y="304">A preprint is a version of its</text>
<text class="note" x="434" y="320">published work; STG records</text>
<text class="note" x="434" y="336">are test data</text>

<rect class="class" x="420" y="460" width="260" height="110" rx="10"/>
<text class="name" x="434" y="486">Source</text>
<text class="attr" x="434" y="508">name, issn</text>
<text class="note" x="434" y="536">Tiers count upwards;</text>
<text class="note" x="434" y="552">K0 is a delisting</text>

<!-- code lists -->
<rect class="list" x="840" y="150" width="200" height="96" rx="6"/>
<text class="listname" x="854" y="180">Work types</text>
<text class="attr" x="854" y="204">ART, REV, SUP, PPR,</text>
<text class="attr" x="854" y="222">EDT, ERR, PTX</text>

<rect class="list" x="840" y="262" width="200" height="84" rx="6"/>
<text class="listname" x="854" y="292">Record sources</text>
<text class="attr" x="854" y="316">FEED, CRIS, STG</text>

<rect class="list" x="840" y="420" width="200" height="84" rx="6"/>
<text class="listname" x="854" y="450">Source types</text>
<text class="attr" x="854" y="474">JOU, REP</text>

<rect class="list" x="840" y="524" width="200" height="84" rx="6"/>
<text class="listname" x="854" y="554">Tiers</text>
<text class="attr" x="854" y="578">K3, K2, K1, K0</text>

<rect class="list" x="60" y="620" width="240" height="70" rx="6"/>
<text class="listname" x="74" y="646">Institution types</text>
<text class="attr" x="74" y="670">SYS, UNI, LAB, AFF, CO, GOV</text>

<!-- link labels -->
<text class="label l-link" x="188" y="195">author</text>
<text class="label l-link" x="188" y="405">institution</text>
<text class="label l-link" x="359" y="287" text-anchor="middle">work</text>
<text class="label l-link" x="362" y="524">parent</text>
<text class="label l-link" x="508" y="170">citingWork</text>
<text class="label l-link" x="608" y="170">citedWork</text>
<text class="label l-link" x="558" y="424">source</text>
<text class="label l-link" x="752" y="354">versionOf</text>
<text class="label l-code" x="759" y="214" text-anchor="middle">workType</text>
<text class="label l-code" x="759" y="292" text-anchor="middle">recordSource</text>
<text class="label l-code" x="759" y="474" text-anchor="middle">sourceType</text>
<text class="label l-code" x="759" y="548" text-anchor="middle">tier</text>
<text class="label l-code" x="188" y="604">institutionType</text>

<!-- key -->
<rect class="class" x="420" y="606" width="22" height="14" rx="3"/>
<text class="note" x="450" y="618" style="font-style:normal">Class, with its plain values</text>
<rect class="list" x="420" y="630" width="22" height="14" rx="3"/>
<text class="note" x="450" y="642" style="font-style:normal">Code list, with the codes in the CSVs</text>
<path class="link" d="M420,662 L442,662"/>
<text class="note" x="450" y="666" style="font-style:normal">Link between classes</text>
<path class="code" d="M420,684 L442,684"/>
<text class="note" x="450" y="688" style="font-style:normal">Link to a code list</text>
</svg>

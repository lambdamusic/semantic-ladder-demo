<div class="tablewrap flat"><table class="grid">
  <thead><tr><th>Question</th>{% for c in r.conditions %}<th><code>{{ c }}</code></th>{% endfor %}</tr></thead>
  <tbody>{% for row in r.grid %}<tr>
    <td><a href="/runs/{{ r.domain }}/{{ r.id }}/{{ row.q.id }}/"><b>{{ row.q.id }}</b></a> {{ row.q.question }}</td>
    {% for cell in row.cells %}<td class="marks">{% for m in cell %}<span title="{{ m.title }}">{{ m.mark }}</span>{% endfor %}</td>{% endfor %}
  </tr>{% endfor %}</tbody>
</table></div>

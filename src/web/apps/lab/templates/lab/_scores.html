<div class="scorerow">
  <div class="scorehead"><a href="/runs/{{ r.domain }}/{{ r.id }}/">{{ r.meta.model }}, {% if r.mode == "query" %}writing queries{% else %}reading the data{% endif %}</a> <span class="dim">{{ r.questions }} questions, {{ r.meta.runs }} repeats</span></div>
  <div class="compare">{% for c in r.rows %}{% if c.repeats %}<div class="num"><div class="n">{{ c.acc }}%</div><div class="l"><code>{{ c.condition }}</code></div><div class="ci">{{ c.lo }}–{{ c.hi }}</div></div>{% endif %}{% endfor %}</div>
</div>

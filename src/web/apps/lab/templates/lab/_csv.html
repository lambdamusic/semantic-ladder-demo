<section class="query">
  <div class="qhead"><strong><code>{{ t.name }}</code></strong><span class="meta">{{ t.n }} rows</span></div>
  <div class="tablewrap"><table>
    <thead><tr>{% for h in t.header %}<th>{{ h }}</th>{% endfor %}</tr></thead>
    <tbody>{% for row in t.rows %}<tr>{% for v in row %}<td>{{ v }}</td>{% endfor %}</tr>{% endfor %}</tbody>
  </table></div>
</section>

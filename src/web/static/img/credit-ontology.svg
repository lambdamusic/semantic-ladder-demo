<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>The credit ratings ontology: three classes (instrument, entity and rating action), the links between them, and the code lists they use</title>
<desc>Three classes. An instrument has an issuer and a guarantor, both entities, and an entity has a parent. A rating action is about an entity or an instrument. Code lists hang off each class: seniorities, entity types, and rating types, currency bases, action types, outlooks and rating watches.</desc>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b6fd8"/></marker>
  <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b7791f"/></marker>
  <style>
    .class { fill: #eaf2ff; stroke: #3b6fd8; stroke-width: 1.5; }
    .list { fill: #fdf6e3; stroke: #b7791f; stroke-width: 1.2; }
    .name { font-size: 15px; font-weight: 700; fill: #111827; }
    .listname { font-size: 13px; font-weight: 700; fill: #111827; }
    .attr { font-size: 12px; font-family: SF Mono, Menlo, Consolas, monospace; fill: #1f2937; }
    .note { font-size: 11.5px; font-style: italic; fill: #5b6475; }
    .link { fill: none; stroke: #3b6fd8; stroke-width: 1.6; marker-end: url(#a); }
    .code { fill: none; stroke: #b7791f; stroke-width: 1.3; marker-end: url(#c); }
    .label { font-size: 12px; font-family: SF Mono, Menlo, Consolas, monospace; paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
    .l-link { fill: #1f3a68; font-weight: 600; }
    .l-code { fill: #8a5a12; }
  </style>
</defs>
<rect width="1080" height="620" fill="#ffffff"/>

<!-- links first, so the boxes sit on top of their ends -->
<path class="link" d="M400,200 L150,298"/>
<path class="link" d="M480,200 L260,298"/>
<path class="link" d="M460,370 L312,370"/>
<path class="link" d="M540,300 L540,202"/>
<path class="link" d="M240,440 C240,500 360,500 312,422"/>
<path class="code" d="M370,135 L282,135"/>
<path class="code" d="M130,440 L130,518"/>
<path class="code" d="M700,330 L858,102"/>
<path class="code" d="M700,350 L858,206"/>
<path class="code" d="M700,375 L858,310"/>
<path class="code" d="M700,400 L858,414"/>
<path class="code" d="M700,425 L858,518"/>

<!-- classes -->
<rect class="class" x="370" y="70" width="240" height="130" rx="10"/>
<text class="name" x="384" y="96">Instrument</text>
<text class="attr" x="384" y="118">description</text>
<text class="attr" x="384" y="136">currency, maturity</text>
<text class="note" x="384" y="164">Its rating is not the</text>
<text class="note" x="384" y="180">issuer's rating</text>

<rect class="class" x="70" y="300" width="240" height="140" rx="10"/>
<text class="name" x="84" y="326">Entity</text>
<text class="attr" x="84" y="348">lei, name, country</text>
<text class="attr" x="84" y="366">sourceSystem</text>
<text class="note" x="84" y="394">Same LEI, same entity,</text>
<text class="note" x="84" y="410">however many records</text>

<rect class="class" x="460" y="300" width="240" height="150" rx="10"/>
<text class="name" x="474" y="326">Rating action</text>
<text class="attr" x="474" y="348">date, rating, comment</text>
<text class="note" x="474" y="376">A rating holds until the next</text>
<text class="note" x="474" y="392">action on the same thing,</text>
<text class="note" x="474" y="408">type and basis</text>

<!-- code lists -->
<rect class="list" x="70" y="95" width="210" height="80" rx="6"/>
<text class="listname" x="84" y="124">Seniorities</text>
<text class="attr" x="84" y="148">SU, SUB</text>

<rect class="list" x="70" y="520" width="210" height="80" rx="6"/>
<text class="listname" x="84" y="549">Entity types</text>
<text class="attr" x="84" y="573">CORP, BANK, FINSUB, SOV</text>

<rect class="list" x="860" y="60" width="200" height="84" rx="6"/>
<text class="listname" x="874" y="90">Rating types</text>
<text class="attr" x="874" y="114">LTIDR, STIDR, INST, CC</text>

<rect class="list" x="860" y="164" width="200" height="84" rx="6"/>
<text class="listname" x="874" y="194">Currency bases</text>
<text class="attr" x="874" y="218">FC, LC</text>

<rect class="list" x="860" y="268" width="200" height="84" rx="6"/>
<text class="listname" x="874" y="298">Action types</text>
<text class="attr" x="874" y="322">AS, AF, UG, DG, RW, WD</text>

<rect class="list" x="860" y="372" width="200" height="84" rx="6"/>
<text class="listname" x="874" y="402">Outlooks</text>
<text class="attr" x="874" y="426">STA, POS, NEG</text>

<rect class="list" x="860" y="476" width="200" height="84" rx="6"/>
<text class="listname" x="874" y="506">Rating Watches</text>
<text class="attr" x="874" y="530">RWN</text>

<!-- link labels -->
<text class="label l-link" x="262" y="250" text-anchor="middle">issuer</text>
<text class="label l-link" x="372" y="250" text-anchor="middle">guarantor</text>
<text class="label l-link" x="385" y="362" text-anchor="middle">ratedThing</text>
<text class="label l-link" x="548" y="255">ratedThing</text>
<text class="label l-link" x="290" y="496" text-anchor="middle">parent</text>
<text class="label l-code" x="326" y="127" text-anchor="middle">seniority</text>
<text class="label l-code" x="138" y="484">entityType</text>
<text class="label l-code" x="779" y="220" text-anchor="middle">ratingType</text>
<text class="label l-code" x="779" y="282" text-anchor="middle">ccyBasis</text>
<text class="label l-code" x="779" y="347" text-anchor="middle">action</text>
<text class="label l-code" x="779" y="412" text-anchor="middle">outlook</text>
<text class="label l-code" x="779" y="476" text-anchor="middle">watch</text>

<!-- key -->
<rect class="class" x="370" y="522" width="22" height="14" rx="3"/>
<text class="note" x="400" y="534" style="font-style:normal">Class, with its plain values</text>
<rect class="list" x="370" y="546" width="22" height="14" rx="3"/>
<text class="note" x="400" y="558" style="font-style:normal">Code list, with the codes in the CSVs</text>
<path class="link" d="M370,578 L392,578"/>
<text class="note" x="400" y="582" style="font-style:normal">Link between classes</text>
<path class="code" d="M370,600 L392,600"/>
<text class="note" x="400" y="604" style="font-style:normal">Link to a code list</text>
</svg>
